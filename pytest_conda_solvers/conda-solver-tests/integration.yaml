    kind: solve
    description: |
      The first solver invocation of test_pinned_1 solves numpy from channel-1
      before any pins are set, so system resolves to build 1. The later
      pinned_1 entries were named before this stage was ported, so their
      numeric suffixes run one behind the upstream invocation number.
    input:
      channels: channel-1
      specs_to_add: numpy
    output:
      final_state:
        - channel-1/${{ arch }}::openssl-1.0.1c-0
        - channel-1/${{ arch }}::readline-6.2-0
        - channel-1/${{ arch }}::sqlite-3.7.13-0
        - channel-1/${{ arch }}::system-5.8-1
        - channel-1/${{ arch }}::tk-8.5.13-0
        - channel-1/${{ arch }}::zlib-1.2.7-0
        - channel-1/${{ arch }}::python-3.3.2-0
