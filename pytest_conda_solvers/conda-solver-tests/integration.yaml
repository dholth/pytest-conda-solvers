    kind: unsatisfiable
    description: |
      libmamba variant: raises UnsatisfiableError instead, and upstream
      checks the message names the scikit-learn request and the python
      requirement, see
      https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L2444-L2452
