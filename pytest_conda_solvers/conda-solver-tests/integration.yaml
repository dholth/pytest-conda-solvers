    input:
      channels: channel-1
      specs_to_add: scikit-learn==0.13
      prefix: channel-1/${{ arch }}::system-5.8-0
      history_specs: system=5.8=0
      ignore_pinned: false
      pinned_packages:
        - python=2.6
        - iopro<=1.4.2
    error:
      exception: SpecsConfigurationConflictError
      requested_specs:
        - scikit-learn==0.13
      pinned_specs:
        - python=2.6

