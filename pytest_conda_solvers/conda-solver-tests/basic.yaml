  - name: test_force_reinstall_1_3
    id: B049
    provenance:
      node_id: tests/core/test_solve.py::test_force_reinstall_1::3
      commit: 03329e0f4a627c9b9aa92ef34f7f93b9aa83e438
      url: https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L2681-L2714
    kind: solve_for_diff
    description: |
      Re-install python=2 into an env that already has it, with force_reinstall=True.
      The solver produces a reinstall: unlink and relink the same package.
      Upstream asserts only that exactly one record is unlinked, exactly one
      is linked, and that the two are equal, without naming the package, see
      https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L2708-L2710.
      Pinning the record as python-2.7.5-0 is a strengthening, entailed by
      python=2 being the only spec and the prefix already holding
      python-2.7.5-0.
    input:
      channels: channel-1
      specs_to_add: "python=2"
      prefix:
        - channel-1/${{ arch }}::openssl-1.0.1c-0
        - channel-1/${{ arch }}::readline-6.2-0
        - channel-1/${{ arch }}::sqlite-3.7.13-0
        - channel-1/${{ arch }}::system-5.8-1
        - channel-1/${{ arch }}::tk-8.5.13-0
        - channel-1/${{ arch }}::zlib-1.2.7-0
        - channel-1/${{ arch }}::python-2.7.5-0
      history_specs: "python=2"
      force_reinstall: true
    output:
      unlink_precs:
        - channel-1/${{ arch }}::python-2.7.5-0
      link_precs:
        - channel-1/${{ arch }}::python-2.7.5-0

