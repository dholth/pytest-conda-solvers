  - name: test_channel_priority_churn_minimized_2_libmamba
    id: B024b
    provenance:
      node_id: tests/core/test_solve.py::test_channel_priority_churn_minimized::2
      commit: 03329e0f4a627c9b9aa92ef34f7f93b9aa83e438
      url: https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L2765-L2803
    kind: solve_for_diff
    solvers: libmamba
    description: |
      libmamba requires force_reinstall=True to act on the itsdangerous spec when
      freeze_installed is active, mirroring upstream's libmamba-only solver
      kwargs. Without it the solver considers the current state satisfying and
      makes no change, see
      https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L2783-L2788.
      Upstream asserts only that exactly one record is unlinked and one is
      linked, see
      https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L2802-L2803.
      The exact record identities pinned here strengthen that check. In this
      port libmamba was observed to reinstall the same arch-specific build
      already in the prefix (py37_1 from channel-4) rather than switch to the
      noarch build from the higher-priority channel-2, so the expected link
      differs from the classic variant.
