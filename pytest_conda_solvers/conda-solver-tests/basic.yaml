tests:
  - name: solve_1_1
    id: B001
    provenance:
      node_id: tests/core/test_solve.py::test_solve_1::1
      commit: 03329e0f4a627c9b9aa92ef34f7f93b9aa83e438
      url: https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L58-L124
    kind: solve
    description: |
      Upstream marks the whole of test_solve_1 flaky with reruns=5, so this
      stage carries the same rerun allowance there, see
      https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L56-L58.
      Upstream's docstring only documents mis-picks in the python=2 stage
      (solve_1_2). In this port the result was observed to be deterministic,
      so the entry runs unrestricted without any rerun allowance.
    input:
      channels: channel-1
      specs_to_add: numpy
    output:
      final_state:
        - channel-1/${{ arch }}::openssl-1.0.1c-0
        - channel-1/${{ arch }}::readline-6.2-0
        - channel-1/${{ arch }}::sqlite-3.7.13-0
        - channel-1/${{ arch }}::system-5.8-1
        - channel-1/${{ arch }}::tk-8.5.13-0
        - channel-1/${{ arch }}::zlib-1.2.7-0
        - channel-1/${{ arch }}::python-3.3.2-0
        - channel-1/${{ arch }}::numpy-1.7.1-py33_0

  - name: solve_1_2
    id: B002
    provenance:
      node_id: tests/core/test_solve.py::test_solve_1::2
      commit: 03329e0f4a627c9b9aa92ef34f7f93b9aa83e438
      url: https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L58-L124
    kind: solve
    description: |
      Upstream marks test_solve_1 flaky with reruns=5 because libmamba sometimes
      resolves this stage to python-2.6.8-6 and numpy-1.7.1-py26_0, see
      https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L56-L82.
      In this port the libmamba result was observed to be deterministic, so the
      entry runs unrestricted without any rerun allowance.
    input:
      channels: channel-1
      specs_to_add:
        - python=2
      prefix:
        - channel-1/${{ arch }}::openssl-1.0.1c-0
        - channel-1/${{ arch }}::readline-6.2-0
        - channel-1/${{ arch }}::sqlite-3.7.13-0
        - channel-1/${{ arch }}::system-5.8-1
        - channel-1/${{ arch }}::tk-8.5.13-0
        - channel-1/${{ arch }}::zlib-1.2.7-0
        - channel-1/${{ arch }}::python-3.3.2-0
        - channel-1/${{ arch }}::numpy-1.7.1-py33_0
      history_specs:
        - numpy
    output:
      final_state:
        - channel-1/${{ arch }}::openssl-1.0.1c-0
        - channel-1/${{ arch }}::readline-6.2-0
        - channel-1/${{ arch }}::sqlite-3.7.13-0
        - channel-1/${{ arch }}::system-5.8-1
        - channel-1/${{ arch }}::tk-8.5.13-0
        - channel-1/${{ arch }}::zlib-1.2.7-0
        - channel-1/${{ arch }}::python-2.7.5-0
        - channel-1/${{ arch }}::numpy-1.7.1-py27_0

  - name: test_iopro_mkl
    id: B003
    provenance:
      node_id: conda/testing/solver_helpers.py::SolverTests.test_iopro_mkl
      commit: 03329e0f4a627c9b9aa92ef34f7f93b9aa83e438
      url: https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/conda/testing/solver_helpers.py#L244-L259
    kind: solve
    solvers: classic
    description: |
      Upstream skips this test for libmamba because features are not supported,
      see https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/test_solvers.py#L22-L40.
      Upstream asserts an unordered set of records, so the record order pinned
      here is a strengthening taken from the classic solver's observed order.
    input:
      channels: channel-1
      specs_to_add:
        - iopro 1.4*
        - python 2.7*
        - numpy 1.7*
      add_pip: true
    output:
      final_state:
        - channel-1/${{ arch }}::openssl-1.0.1c-0
        - channel-1/${{ arch }}::readline-6.2-0
        - channel-1/${{ arch }}::sqlite-3.7.13-0
        - channel-1/${{ arch }}::system-5.8-1
        - channel-1/${{ arch }}::tk-8.5.13-0
        - channel-1/${{ arch }}::unixodbc-2.3.1-0
        - channel-1/${{ arch }}::zlib-1.2.7-0
        - channel-1/${{ arch }}::python-2.7.5-0
        - channel-1/${{ arch }}::distribute-0.6.36-py27_1
        - channel-1/${{ arch }}::numpy-1.7.1-py27_0
        - channel-1/${{ arch }}::iopro-1.4.3-np17py27_p0
        - channel-1/${{ arch }}::pip-1.3.1-py27_1

