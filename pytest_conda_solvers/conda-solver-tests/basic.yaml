  - name: test_timestamps_and_deps_4
    id: B175
    provenance:
      node_id: conda/testing/solver_helpers.py::SolverTests::test_timestamps_and_deps::4
      commit: 03329e0f4a627c9b9aa92ef34f7f93b9aa83e438
      url: https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/conda/testing/solver_helpers.py#L605-L643
    kind: solve
    description: |
      Regression pair for https://github.com/conda/conda/issues/6271:
      reinstalling ts_mypackage alongside the exact libpng 1.2 record must
      reproduce the hash12 solution. The newer-timestamped hash12 build is
      itself the expected pick here, so the timestamp disruption upstream
      guards against can only bite in the 1.5 pair, see
      https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/conda/testing/solver_helpers.py#L630-L636
      Upstream splats the inner solve's records, whose derived MatchSpecs
      also carry the channel and subdir. The libpng spec here keeps only the
      name, version, and build, which is looser but inert because libpng
      exists only in channel-1.
    input:
      add_pip: true
      channels:
        - channel-7
        - channel-1
      specs_to_add:
        - ts_mypackage
        - "libpng==1.2.50=0"
    output:
      final_state:
        - channel-1/${{ arch }}::libpng-1.2.50-0
        - channel-7/${{ arch }}::ts_mypackage-1.0-hash12_0

