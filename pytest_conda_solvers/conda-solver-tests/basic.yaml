    kind: unsatisfiable
    description: >-
      Fails because numpy=1.5 is in the history as an explicit spec. Channel-1's
      numba=0.5 builds need numpy 1.6* or numpy 1.7*, neither of which the
      history-pinned numpy=1.5 satisfies, and with only_deps the solver cannot
      override that pin.
    input:
      channels: channel-1
      specs_to_add: "numba=0.5"
      prefix:
        - channel-1/${{ arch }}::openssl-1.0.1c-0
        - channel-1/${{ arch }}::readline-6.2-0
        - channel-1/${{ arch }}::sqlite-3.7.13-0
        - channel-1/${{ arch }}::system-5.8-1
        - channel-1/${{ arch }}::tk-8.5.13-0
        - channel-1/${{ arch }}::zlib-1.2.7-0
        - channel-1/${{ arch }}::python-2.7.3-7
        - channel-1/${{ arch }}::numpy-1.5.1-py27_4
      history_specs:
        - "numpy=1.5"
        - "python=2.7.3"
      deps_modifier: only_deps
    error:
      exception: UnsatisfiableError
      entries: []

