  - name: test_unsatisfiable_from_channel_1_1
    id: B005
    provenance:
      node_id: conda/testing/solver_helpers.py::SolverTests.test_unsat_from_r1::1
      commit: 03329e0f4a627c9b9aa92ef34f7f93b9aa83e438
      url: https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/conda/testing/solver_helpers.py#L351-L380
    kind: unsatisfiable
    input:
      channels: channel-1
      specs_to_add:
        - numpy 1.5*
        - scipy 0.12.0b1
      add_pip: true
    error:
      exception: UnsatisfiableError
      entries:
        - numpy=1.5
        - [scipy==0.12.0b1, "numpy[version='1.6.*|1.7.*']"]

  - name: test_unsatisfiable_from_channel_1_2
    id: B006
    provenance:
      node_id: conda/testing/solver_helpers.py::SolverTests.test_unsat_from_r1::2
      commit: 03329e0f4a627c9b9aa92ef34f7f93b9aa83e438
      url: https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/conda/testing/solver_helpers.py#L351-L380
    kind: unsatisfiable
    input:
      channels: channel-1
      specs_to_add:
        - numpy 1.5*
        - python 3*
      add_pip: true
    error:
      exception: UnsatisfiableError
      entries:
        - [numpy=1.5, nose, python=3.3]
        - [numpy=1.5, "python[version='2.6.*|2.7.*']"]
        - python=3

  - name: test_unsatisfiable_from_channel_1_3
    id: B007
    provenance:
      node_id: conda/testing/solver_helpers.py::SolverTests.test_unsat_from_r1::3
      commit: 03329e0f4a627c9b9aa92ef34f7f93b9aa83e438
      url: https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/conda/testing/solver_helpers.py#L351-L380
    kind: unsatisfiable
    description: |
      Upstream accepts ResolvePackageNotFound or PackagesNotFoundError and
      checks bad_deps for classic only, see
      https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/conda/testing/solver_helpers.py#L375-L380
    solvers: classic
    input:
      channels: channel-1
      specs_to_add:
        - numpy 1.5*
        - numpy 1.6*
      add_pip: true
    error:
      exception: ResolvePackageNotFound
      entries:
        - numpy[version='1.5.*,1.6.*']

  - name: test_unsatisfiable_from_channel_1_3b
    id: B007b
    provenance:
      node_id: conda/testing/solver_helpers.py::SolverTests.test_unsat_from_r1::3
      commit: 03329e0f4a627c9b9aa92ef34f7f93b9aa83e438
      url: https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/conda/testing/solver_helpers.py#L351-L380
    kind: unsatisfiable
    description: |
      libmamba variant: raises PackagesNotFoundError for the same conflicting
      numpy globs, matching upstream's accepted exception pair. Upstream checks
      nothing beyond the exception for the PackagesNotFoundError case, see
      https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/conda/testing/solver_helpers.py#L375-L380
      The harness compares package names only, so the version text in entries
      is informative rather than asserted.
    solvers: libmamba
    input:
      channels: channel-1
      specs_to_add:
        - numpy 1.5*
        - numpy 1.6*
      add_pip: true
    error:
      exception: PackagesNotFoundError
      entries:
        - numpy[version='1.5.*,1.6.*']

  - name: test_unsatisfiable_from_channel_1_3c
    id: B007c
    provenance:
      node_id: conda/testing/solver_helpers.py::SolverTests.test_unsat_from_r1::3
      commit: 8e52b72b74c3b44bb9b4c8d7bb5cf4b9e76da453
      url: https://github.com/conda/conda/blob/8e52b72b74c3b44bb9b4c8d7bb5cf4b9e76da453/conda/testing/solver_helpers.py#L351-L382
    kind: unsatisfiable
    description: |
      rattler variant: raises UnsatisfiableError for the same conflicting
      numpy globs. conda 26.7.0 widened the accepted exception tuple to
      include UnsatisfiableError and checks bad_deps only on the
      ResolvePackageNotFound branch, so the exception type is the whole
      expectation here, see
      https://github.com/conda/conda/blob/8e52b72b74c3b44bb9b4c8d7bb5cf4b9e76da453/conda/testing/solver_helpers.py#L375-L382
    solvers: rattler
    input:
      channels: channel-1
      specs_to_add:
        - numpy 1.5*
        - numpy 1.6*
      add_pip: true
    error:
      exception: UnsatisfiableError
      entries: []

