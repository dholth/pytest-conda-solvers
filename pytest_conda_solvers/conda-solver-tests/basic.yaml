  - name: test_surplus_features_1
    id: B137
    provenance:
      node_id: conda/testing/solver_helpers.py::SolverTests.test_surplus_features_1
      commit: 03329e0f4a627c9b9aa92ef34f7f93b9aa83e438
      url: https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/conda/testing/solver_helpers.py#L1110-L1135
    kind: solve
    description: |
      A surplus feature carrier is not installed when nothing needs it: the
      higher package2 version wins (2.0 over 1.0, both build 0), so its
      package1 dependency stays out. package1 merely carries the feature,
      while the feature package provides it through track_features. Features
      are classic-only: upstream skips test_surplus_features_1 under
      conda-libmamba-solver (see
      https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/test_solvers.py#L23-L39).
      Upstream compares this state as an unordered set (see
      https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/conda/testing/solver_helpers.py#L1132-L1135),
      and the order here is pinned from classic solver behaviour.
    solvers: classic
    input:
      channels: channel-8
      specs_to_add:
        - package2
        - feature
      add_pip: true
    output:
      final_state:
        - channel-8/${{ arch }}::feature-1.0-0
        - channel-8/${{ arch }}::package2-2.0-0

  - name: test_surplus_features_2
    id: B138
    provenance:
      node_id: conda/testing/solver_helpers.py::SolverTests.test_surplus_features_2
      commit: 03329e0f4a627c9b9aa92ef34f7f93b9aa83e438
      url: https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/conda/testing/solver_helpers.py#L1137-L1164
    kind: solve
    description: |
      Same install against channel-9. Upstream builds two package2 1.0 records
      that share the default build string, so they collide on filename in the
      written repodata and only the build_number 1 record without the package1
      dependency survives (see
      https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/conda/testing/solver_helpers.py#L1137-L1164).
      channel-9 mirrors that surviving record, so no build-number competition
      is exercised and package1 stays out. Features are classic-only: upstream
      skips test_surplus_features_2 under conda-libmamba-solver (see
      https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/test_solvers.py#L23-L39).
      Upstream compares this state as an unordered set (see
      https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/conda/testing/solver_helpers.py#L1161-L1164),
      and the order here is pinned from classic solver behaviour.
    solvers: classic
    input:
      channels: channel-9
      specs_to_add:
        - package2
        - feature
      add_pip: true
    output:
      final_state:
        - channel-9/${{ arch }}::feature-1.0-0
        - channel-9/${{ arch }}::package2-1.0-0

