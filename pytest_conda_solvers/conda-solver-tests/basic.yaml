      channel_priority: disabled
    output:
      final_state:
        - channel-12/${{ arch }}::c-2.0-0
        - channel-12/${{ arch }}::a-2.0-0
        - channel-12/${{ arch }}::b-2.0-0

  - name: test_unsat_channel_priority_3
    id: B153
    provenance:
      node_id: conda/testing/solver_helpers.py::SolverTests::test_unsat_channel_priority::3
      commit: 03329e0f4a627c9b9aa92ef34f7f93b9aa83e438
      url: https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/conda/testing/solver_helpers.py#L992-L1051
    kind: unsatisfiable
    description: |
      With strict priority, c must come from channel-11, which only has c 1.0,
      so b cannot be satisfied. Upstream literally sets CONDA_CHANNEL_PRIORITY
      to True, which conda maps to flexible, the same setting under which its
      stage 1 install succeeds, so strict is used here to realise the intended
      unsatisfiability, see
      https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/conda/testing/solver_helpers.py#L1048
      Classic reports the a-c chain alongside the b conflict that upstream's
      (xfail) assertion names, see
      https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/conda/testing/solver_helpers.py#L1051
    input:
      channels: [channel-11, channel-12]
      specs_to_add: [a, b]
      add_pip: true
      channel_priority: strict
    error:
      exception: UnsatisfiableError
      entries:
        - [a, c]
        - ["b", "c[version='>=2,<3']"]

