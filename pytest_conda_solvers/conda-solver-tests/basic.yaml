  - name: test_circular_dependencies
    id: B073
    provenance:
      node_id: conda/testing/solver_helpers.py::SolverTests::test_circular_dependencies::1
      commit: 03329e0f4a627c9b9aa92ef34f7f93b9aa83e438
      url: https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/conda/testing/solver_helpers.py#L830-L845
    kind: solve
    description: |
      Solving for packages with circular dependencies (package1 depends on package2,
      package2 depends on package1) should succeed. The solver resolves the cycle
      and installs both packages. Upstream asserts only that this combined
      install equals the two single-package installs (B172 and B173), never
      the contents, so the exact ordered state pinned here is a deliberate
      strengthening, see
      https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/conda/testing/solver_helpers.py#L841-L845
      Upstream's repo also carries the channel-1 index alongside the circular
      pair, so channel-1 is included here for input parity. It cannot affect
      the outcome because the two packages depend only on each other, see
      https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/conda/testing/solver_helpers.py#L831-L840
    input:
      add_pip: true
      channels:
        - channel-7
        - channel-1
      specs_to_add:
        - package1
        - package2
    output:
      final_state:
        - channel-7/${{ arch }}::package1-1.0-0
        - channel-7/${{ arch }}::package2-1.0-0

