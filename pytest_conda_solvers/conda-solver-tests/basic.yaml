      commit: 03329e0f4a627c9b9aa92ef34f7f93b9aa83e438
      url: https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L1533-L1597
    kind: solve
    description: |
      Install foobar + qux simultaneously into an empty prefix. foobar-2.0
      needs libfoo-2.0, but qux-1.0 needs libfoo-1.0, so the solver picks
