  - name: test_globstr_matchspec_non_compatible_2
    id: B083
    provenance:
      node_id: tests/core/test_solve.py::test_globstr_matchspec_non_compatible::2
      commit: 03329e0f4a627c9b9aa92ef34f7f93b9aa83e438
      url: https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L3833-L3858
    kind: unsatisfiable
    description: |
      Two glob build string specs for accelerate that cannot be satisfied together:
      np17* and *np16* cannot match the same package.
      Upstream's first stage, where np17* and np16* fail with ValueError at
      solver instantiation (see
      https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L3833-L3842),
      is not expressible in this YAML harness and is ported as the white-box
      test test_globstr_matchspec_non_compatible_construction instead.
      Upstream accepts either PackagesNotFoundError or ResolvePackageNotFound
      for this stage, see
      https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L3849-L3852.
      The per-solver split narrows that tuple to the class each solver was
      observed to raise, ResolvePackageNotFound for classic here.
    solvers: classic
    input:
      channels: channel-1
      specs_to_add:
        - "accelerate=*=np17*"
        - "accelerate=*=*np16*"
    error:
      exception: ResolvePackageNotFound
      entries: []

