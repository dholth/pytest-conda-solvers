    kind: unsatisfiable
    description: >-
      Fails because numpy=1.5 is in the history as an explicit spec. Channel-1's
      numba=0.5 builds need numpy 1.6* or numpy 1.7*, neither of which the
      history-pinned numpy=1.5 satisfies, and with only_deps the solver cannot
      override that pin.
    input:
      channels: channel-1
      specs_to_add: "numba=0.5"
      prefix:
