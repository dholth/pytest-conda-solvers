      url: https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L856-L944
    kind: solve
    description: |
      Re-solving the inconsistent env (no specs requested) restores python and the
      original consistent state.
      This stage carries upstream's function-level strict libmamba xfail
      (see
      https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L857-L864).
      Under libmamba this stage fails on content, since python is not restored,
      which is the known limitation the upstream xfail tracks. Stage 3 also
      orders its records differently under libmamba, see test_force_remove_1_3b.
