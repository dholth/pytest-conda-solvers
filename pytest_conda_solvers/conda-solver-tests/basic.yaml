        - channel-1/${{ arch }}::python-2.7.3-7
        - channel-1/${{ arch }}::numpy-1.5.1-py27_4
      history_specs:
        - "numpy=1.5"
        - "python=2.7.3"
      deps_modifier: only_deps
    error:
      exception: UnsatisfiableError
      entries: []

