        - channel-2/${{ arch }}::pandas-0.20.3-py27_0

  - name: test_channel_priority_1_1
    id: B148
    provenance:
      node_id: conda/testing/solver_helpers.py::SolverTests::test_channel_priority_1::1
      commit: 03329e0f4a627c9b9aa92ef34f7f93b9aa83e438
      url: https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/conda/testing/solver_helpers.py#L956-L989
    kind: solve
    description: |
      channel-13 (higher priority) holds only pandas 0.10.1 np17py27_0, which
      conflicts with the numpy 1.6* spec, so with flexible priority the solver
      falls back to the channel-1 pandas. Upstream is xfail, see
      https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/conda/testing/solver_helpers.py#L955
      and its stage-1 assertion names a package that does not exist in its
      channel-A, so this expectation reflects actual solver behaviour instead.
      The state is pinned from an empirical solve with pip injection enabled,
      matching upstream's add_pip_as_python_dependency default, so it carries
      the distribute and pip records.
    input:
      channels: [channel-13, channel-1]
      specs_to_add:
        - pandas
        - "python 2.7*"
        - "numpy 1.6*"
      add_pip: true
      channel_priority: flexible
    output:
      final_state:
        - channel-1/${{ arch }}::openssl-1.0.1c-0
        - channel-1/${{ arch }}::readline-6.2-0
        - channel-1/${{ arch }}::sqlite-3.7.13-0
        - channel-1/${{ arch }}::system-5.8-1
        - channel-1/${{ arch }}::tk-8.5.13-0
        - channel-1/${{ arch }}::zlib-1.2.7-0
        - channel-1/${{ arch }}::python-2.7.5-0
