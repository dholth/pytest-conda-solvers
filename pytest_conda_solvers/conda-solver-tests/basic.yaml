  - name: test_channel_priority_churn_minimized_1
    id: B023
    provenance:
      node_id: tests/core/test_solve.py::test_channel_priority_churn_minimized::1
      commit: 03329e0f4a627c9b9aa92ef34f7f93b9aa83e438
      url: https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L2765-L2803
    kind: solve
    description: |
      Upstream computes this first solve and only pretty-prints the result
      without asserting anything about it, see
      https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L2778-L2781.
      This entry therefore only asserts that the solve succeeds. Upstream
      chains the unasserted result into stage 2 by value, which this port
      cannot do, so B024a and B024b instead hardcode the expected state as
      their prefixes. That copy is never checked against what this stage
      actually produces. It matches the channel-4 conda-build solution
      upstream asserts in test_remove_with_constrained_dependencies (see
      https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L2818-L2864)
      with itsdangerous-0.24-py37_1 added in name order, the non-noarch
      variant that upstream's docstring names as the starting state, see
      https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L2766-L2774.
    input:
      channels:
        - channel-4
        - channel-2
      specs_to_add:
        - conda-build
        - itsdangerous
    output: {}

