  - name: test_unsat_channel_priority_1
    id: B151
    provenance:
      node_id: conda/testing/solver_helpers.py::SolverTests::test_unsat_channel_priority::1
      commit: 03329e0f4a627c9b9aa92ef34f7f93b9aa83e438
      url: https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/conda/testing/solver_helpers.py#L992-L1051
    kind: solve
    description: |
      With flexible priority, a and b come from the higher-priority channel-11
      (version 1.0) and only b's dependency c >=2,<3 falls back to channel-12.
      Upstream is xfail because the env var it sets has no effect, see
      https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/conda/testing/solver_helpers.py#L991
      The env var having no effect means the solve runs at the default
      flexible priority, which is what this entry encodes directly. The
      non-strict xfail persists unchanged at conda 26.7.0, see
      https://github.com/conda/conda/blob/8e52b72b74c3b44bb9b4c8d7bb5cf4b9e76da453/conda/testing/solver_helpers.py#L1005
      so the stage is never enforced upstream under any solver, and
      conda-rattler-solver's green run of it reflects that xfail rather than
      agreement with this classic outcome.
    xfail_solvers: rattler
    xfail_reason: "conda's flexible channel priority maps to rattler's Disabled (rattler has no flexible mode), so higher builds from lower-priority channels win, see https://github.com/conda-incubator/conda-rattler-solver/blob/5237b2359ed3df0b2f1c0fa34f80cf448a235a7e/conda_rattler_solver/solver.py#L350-L354"
    input:
      channels: [channel-11, channel-12]
      specs_to_add: [a, b]
      add_pip: true
      channel_priority: flexible
    output:
      final_state:
        - channel-12/${{ arch }}::c-2.0-0
        - channel-11/${{ arch }}::a-1.0-0
        - channel-11/${{ arch }}::b-1.0-0

  - name: test_unsat_channel_priority_2
    id: B152
    provenance:
      node_id: conda/testing/solver_helpers.py::SolverTests::test_unsat_channel_priority::2
      commit: 03329e0f4a627c9b9aa92ef34f7f93b9aa83e438
      url: https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/conda/testing/solver_helpers.py#L992-L1051
    kind: solve
