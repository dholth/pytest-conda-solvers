  - name: test_priority_1_4
    id: B165
    provenance:
      node_id: tests/core/test_solve.py::test_priority_1::4
      commit: 03329e0f4a627c9b9aa92ef34f7f93b9aa83e438
      url: https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L2887-L2989
    kind: solve
    description: |
      Add six<1.10 while removing pytz from the restored channel-2 environment.
      six downgrades to 1.9.0 and pandas leaves with pytz, its dependency.
      Upstream asserts the python and six records plus the absence of pandas
      (see
      https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L2981-L2989),
      and the full state here is pinned from solver behaviour. Stages 1-3 are
      ported as test_priority_1_1 to test_priority_1_3, and the prefix here is
      stage 3's output in its solved order. Upstream marks the whole function
      as a strict xfail with run=False under libmamba (see
      https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L2888-L2897),
      so it never runs there and this entry is classic-only. At conda 26.7.0
      the same strict run=False xfail covers rattler as well, see
      https://github.com/conda/conda/blob/8e52b72b74c3b44bb9b4c8d7bb5cf4b9e76da453/tests/core/test_solve.py#L2966-L2975
      so the classic-only restriction mirrors both solvers.
    solvers: classic
    input:
      channels:
        - channel-2
        - channel-4
      channel_priority: flexible
      specs_to_add: "six<1.10"
      specs_to_remove: pytz
      prefix:
        - channel-4/${{ arch }}::ca-certificates-2018.03.07-0
        - channel-2/${{ arch }}::mkl-2017.0.3-0
        - channel-2/${{ arch }}::openssl-1.0.2l-0
        - channel-2/${{ arch }}::readline-6.2-2
        - channel-2/${{ arch }}::sqlite-3.13.0-0
        - channel-2/${{ arch }}::tk-8.5.18-0
        - channel-2/${{ arch }}::zlib-1.2.11-0
        - channel-2/${{ arch }}::python-2.7.13-0
        - channel-2/${{ arch }}::numpy-1.13.1-py27_0
        - channel-2/${{ arch }}::pytz-2017.2-py27_0
        - channel-2/${{ arch }}::six-1.10.0-py27_0
        - channel-2/${{ arch }}::python-dateutil-2.6.1-py27_0
        - channel-2/${{ arch }}::pandas-0.20.3-py27_0
      history_specs:
        - pandas
        - "python=2.7"
    output:
      final_state:
        - channel-4/${{ arch }}::ca-certificates-2018.03.07-0
        - channel-2/${{ arch }}::openssl-1.0.2l-0
