    kind: solve
    description: |
      libmamba variant of the force_remove stage. The record set matches the
      classic variant exactly, but numpy is ordered last rather than first, so
      upstream's ordered assert (see
      https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L914-L925)
      would fail under libmamba. Upstream never observes this, since the whole
      function carries a strict libmamba xfail (see
      https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L857-L864).
      The order here is pinned from libmamba behaviour. At conda 26.7.0 this
      stage compares as an unordered set under rattler, noting that rattler
      puts numpy last, see
      https://github.com/conda/conda/blob/8e52b72b74c3b44bb9b4c8d7bb5cf4b9e76da453/tests/core/test_solve.py#L944-L949
