tests:
  - name: test_determine_constricting_specs_conflicts
    id: S001
    provenance:
      node_id: tests/core/test_solve.py::test_determine_constricting_specs_conflicts
      commit: 03329e0f4a627c9b9aa92ef34f7f93b9aa83e438
      url: https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L3499-L3535
    kind: determine_constricting_specs
    description: |
      mypkgnot depends on mypkg 0.1.0, so updating mypkg is constricted to
      exactly that version. Upstream only asserts that some constriction is
      named mypkgnot, so the exact single-element list checked here is a
      strengthening, see
      https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L3534-L3535
      Upstream's fixtures carried copy-paste quirks (fn mypkg-0.1.1 on the
      0.1.0 record, build_number 1 on pypi_0 builds), fixed in
      https://github.com/conda/conda/pull/16573 and mirrored here.
    input:
      channels: conda_format_repo
      subdirs: linux-64
      specs_to_add: mypkg
      solution_records:
        - record_type: prefix
          package_type: noarch_generic
          name: mypkg
          version: 0.1.0
          channel: test
          subdir: conda-test
          fn: mypkg-0.1.0
          build: pypi_0
          build_number: 0
          paths_data:
          files:
          depends: []
          constrains: []
        - record_type: prefix
          package_type: noarch_generic
          name: mypkgnot
          version: 1.1.1
          channel: test
          subdir: conda-test
          fn: mypkgnot-1.1.1
          build: pypi_0
          build_number: 0
          paths_data:
          files:
          depends:
            - mypkg 0.1.0
          constrains: []
    output:
      constrictions:
        - package: mypkgnot
          constricting_match_spec: mypkg==0.1.0

  - name: test_determine_constricting_specs_conflicts_upperbound
    id: S002
    provenance:
      node_id: tests/core/test_solve.py::test_determine_constricting_specs_conflicts_upperbound
      commit: 03329e0f4a627c9b9aa92ef34f7f93b9aa83e438
      url: https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L3538-L3574
    kind: determine_constricting_specs
    description: |
      mypkgnot depends on mypkg <=0.1.1, an upper bound that constricts how far
      mypkg can be updated. Upstream only asserts that some constriction is
      named mypkgnot, so the exact single-element list checked here is a
      strengthening, see
      https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L3573-L3574
    input:
      channels: conda_format_repo
      subdirs: linux-64
      specs_to_add: mypkg
      solution_records:
        - record_type: prefix
          package_type: noarch_generic
          name: mypkg
          version: 0.1.1
          channel: test
          subdir: conda-test
          fn: mypkg-0.1.1
          build: pypi_0
          build_number: 0
          paths_data:
          files:
          depends: []
          constrains: []
        - record_type: prefix
          package_type: noarch_generic
          name: mypkgnot
          version: 1.1.1
          channel: test
          subdir: conda-test
          fn: mypkgnot-1.1.1
          build: pypi_0
          build_number: 0
          paths_data:
          files:
          depends:
            - mypkg <=0.1.1
          constrains: []
    output:
      constrictions:
        - package: mypkgnot
          constricting_match_spec: mypkg<=0.1.1

  - name: test_determine_constricting_specs_multi_conflicts
    id: S003
    provenance:
      node_id: tests/core/test_solve.py::test_determine_constricting_specs_multi_conflicts
      commit: 03329e0f4a627c9b9aa92ef34f7f93b9aa83e438
      url: https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L3577-L3628
    kind: determine_constricting_specs
    description: |
      Two installed packages each cap mypkg, so both are reported as
      constrictions. Upstream only asserts that constrictions named mypkgnot
      and notmypkg exist, so the exact two-element list and its order checked
      here are a strengthening, see
      https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L3627-L3628
    input:
      channels: conda_format_repo
      subdirs: linux-64
      specs_to_add: mypkg
      solution_records:
        - record_type: prefix
          package_type: noarch_generic
          name: mypkg
          version: 0.1.1
          channel: test
          subdir: conda-test
          fn: mypkg-0.1.1
          build: pypi_0
          build_number: 0
          paths_data:
          files:
          depends: []
          constrains: []
        - record_type: prefix
          package_type: noarch_generic
          name: mypkgnot
          version: 1.1.1
          channel: test
          subdir: conda-test
          fn: mypkgnot-1.1.1
          build: pypi_0
          build_number: 0
          paths_data:
          files:
          depends:
            - mypkg <=0.1.1
          constrains: []
        - record_type: prefix
          package_type: noarch_generic
          name: notmypkg
          version: 1.1.1
          channel: test
          subdir: conda-test
          fn: mypkgnot-1.1.1
          build: pypi_0
          build_number: 0
          paths_data:
          files:
          depends:
            - mypkg 0.1.1
          constrains: []
    output:
      constrictions:
        - package: mypkgnot
          constricting_match_spec: mypkg<=0.1.1
        - package: notmypkg
          constricting_match_spec: mypkg==0.1.1

