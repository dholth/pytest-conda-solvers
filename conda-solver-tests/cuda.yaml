tests:
  - name: test_cuda_1
    id: C001
    provenance:
      node_id: tests/core/test_solve.py::test_cuda_1
      commit: 03329e0f4a627c9b9aa92ef34f7f93b9aa83e438
      url: https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L249-L258
    kind: solve
    description: |
      With the __cuda virtual package set to 9.2, cudatoolkit resolves to the
      newest build the driver allows. The channel ships only cudatoolkit 9.0
      (needing __cuda >=9.0) and 10.0 (needing __cuda >=10.0), and there is no
      9.2 build, so the 10.0 build is excluded and 9.0 is selected, matching
      upstream's assertion.
    input:
      channels: channel-1
      specs_to_add: cudatoolkit
      override_cuda: '9.2'
    output:
      final_state:
        - channel-1/${{ arch }}::cudatoolkit-9.0-0

  - name: test_cuda_2
    id: C002
    provenance:
      node_id: tests/core/test_solve.py::test_cuda_2
      commit: 03329e0f4a627c9b9aa92ef34f7f93b9aa83e438
      url: https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L261-L270
    kind: solve
    description: |
      A newer __cuda driver of 10.0 lets cudatoolkit resolve to its 10.0 build.
    input:
      channels: channel-1
      specs_to_add: cudatoolkit
      override_cuda: '10.0'
    output:
      final_state:
        - channel-1/${{ arch }}::cudatoolkit-10.0-0

  - name: test_cuda_fail_1
    id: C003
    provenance:
      node_id: tests/core/test_solve.py::test_cuda_fail_1
      commit: 03329e0f4a627c9b9aa92ef34f7f93b9aa83e438
      url: https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L273-L306
    kind: unsatisfiable
    description: |
      An old __cuda driver of 8.0 is too low for any cudatoolkit build, so the
      solve is unsatisfiable. Classic variant. Upstream asserts the full error
      message, see
      https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L298-L306
      The feature line naming the __cuda record is platform dependent, so it
      is not asserted here.
    solvers: classic
    input:
      channels: channel-1
      specs_to_add: cudatoolkit
      override_cuda: '8.0'
    error:
      exception: UnsatisfiableError
      entries: []
      message_includes:
        - "The following specifications were found to be incompatible with your system"
        - "cudatoolkit -> __cuda[version='>=10.0|>=9.0']"
        - "Your installed version is: 8.0"

  - name: test_cuda_fail_1_libmamba
    id: C003b
    provenance:
      node_id: tests/core/test_solve.py::test_cuda_fail_1
      commit: 03329e0f4a627c9b9aa92ef34f7f93b9aa83e438
      url: https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L273-L306
    kind: unsatisfiable
    description: |
      libmamba variant of test_cuda_fail_1. Upstream accepts either of two
      equivalent problem messages, one per cudatoolkit build, see
      https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L283-L297
      The harness cannot express that alternative, so this pins the first
      variant, which is what libmamba produces here.
    solvers: libmamba
    input:
      channels: channel-1
      specs_to_add: cudatoolkit
      override_cuda: '8.0'
    error:
      exception: UnsatisfiableError
      entries: []
      message_includes:
        - |-
          Encountered problems while solving:
            - nothing provides __cuda >=9.0 needed by cudatoolkit-9.0-0

  - name: test_cuda_fail_2
    id: C004
    provenance:
      node_id: tests/core/test_solve.py::test_cuda_fail_2
      commit: 03329e0f4a627c9b9aa92ef34f7f93b9aa83e438
      url: https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L309-L341
    kind: unsatisfiable
    description: |
      With no __cuda driver present at all, cudatoolkit cannot be installed and
      the solve is unsatisfiable. Classic variant. Upstream asserts the full
      error message, see
      https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L334-L341
    solvers: classic
    input:
      channels: channel-1
      specs_to_add: cudatoolkit
      override_cuda: ''
    error:
      exception: UnsatisfiableError
      entries: []
      message_includes:
        - "The following specifications were found to be incompatible with your system"
        - "cudatoolkit -> __cuda[version='>=10.0|>=9.0']"
        - "Your installed version is: not available"

  - name: test_cuda_fail_2_libmamba
    id: C004b
    provenance:
      node_id: tests/core/test_solve.py::test_cuda_fail_2
      commit: 03329e0f4a627c9b9aa92ef34f7f93b9aa83e438
      url: https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L309-L341
    kind: unsatisfiable
    description: |
      libmamba variant of test_cuda_fail_2. Upstream accepts either of two
      equivalent problem messages, one per cudatoolkit build, see
      https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L319-L333
      The harness cannot express that alternative, so this pins the first
      variant, which is what libmamba produces here.
    solvers: libmamba
    input:
      channels: channel-1
      specs_to_add: cudatoolkit
      override_cuda: ''
    error:
      exception: UnsatisfiableError
      entries: []
      message_includes:
        - |-
          Encountered problems while solving:
            - nothing provides __cuda >=9.0 needed by cudatoolkit-9.0-0

  - name: test_cuda_constrain_absent
    id: C005
    provenance:
      node_id: tests/core/test_solve.py::test_cuda_constrain_absent
      commit: 03329e0f4a627c9b9aa92ef34f7f93b9aa83e438
      url: https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L344-L353
    kind: solve
    description: |
      A package that only constrains __cuda (rather than depending on it) still
      installs when no cuda driver is present.
    input:
      channels: channel-1
      specs_to_add: cuda-constrain
      override_cuda: ''
    output:
      final_state:
        - channel-1/${{ arch }}::cuda-constrain-11.0-0

  - name: test_cuda_glibc_sat
    id: C006
    provenance:
      node_id: tests/core/test_solve.py::test_cuda_glibc_sat
      commit: 03329e0f4a627c9b9aa92ef34f7f93b9aa83e438
      url: https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L391-L401
    kind: solve
    description: |
      A package that depends on the __cuda virtual package and constrains
      __glibc installs when the driver and glibc overrides satisfy both.
      Upstream restricts this test to Linux because the __glibc virtual
      package is only generated there, see
      https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L390
      On non-Linux hosts the glibc override is inert and the constraint is not
      exercised, but cuda-glibc still installs because its __glibc entry is
      only a constrains, so the test passes everywhere.
    input:
      channels: channel-1
      specs_to_add: cuda-glibc
      override_cuda: '10.0'
      override_glibc: '2.23'
    output:
      final_state:
        - channel-1/${{ arch }}::cuda-glibc-10.0-0

  - name: test_solve_msgs_exclude_vp
    id: C007
    provenance:
      node_id: tests/core/test_solve.py::test_solve_msgs_exclude_vp
      commit: 03329e0f4a627c9b9aa92ef34f7f93b9aa83e438
      url: https://github.com/conda/conda/blob/03329e0f4a627c9b9aa92ef34f7f93b9aa83e438/tests/core/test_solve.py#L233-L246
    kind: unsatisfiable
    description: |
      python=2.7.5 conflicts with readline=5.0, so the solve fails. The solver
      hint must not mention the __cuda virtual package, which is not a
      dependency of anything requested.
    input:
      channels: channel-1
      specs_to_add:
        - "python =2.7.5"
        - "readline =5.0"
      override_cuda: '10.0'
    error:
      exception: UnsatisfiableError
      entries: []
      message_excludes: "__cuda==10.0"
